name: Build

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

# Evita builds duplicados si empujás varios commits seguidos a la misma rama/PR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Hace falta "write" para que el paso de abajo pueda commitear el log de
# build fallido de vuelta al repo (ver "Guardar log si el build falló").
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # DragonMineZ no se puede redistribuir en este repo, así que la jar no
      # está commiteada. Este paso la resuelve, en orden de preferencia:
      #   1. Ya está en libs/ (la commiteaste vos, ver .gitignore).
      #   2. El secret DMZ_JAR_URL apunta a una URL de descarga (tu propio
      #      Nexus/Drive/servidor; configuralo en Settings -> Secrets ->
      #      Actions de este repo).
      #   3. Ninguna de las dos: falla el build con un mensaje claro, en vez
      #      de fallar más adelante con un error de compilación confuso.
      - name: Resolver dependencia de DragonMineZ
        env:
          DMZ_JAR_URL: ${{ secrets.DMZ_JAR_URL }}
        run: |
          mkdir -p libs
          if ls libs/*.jar >/dev/null 2>&1; then
            echo "Ya hay una jar en libs/, se usa esa."
          elif [ -n "$DMZ_JAR_URL" ]; then
            echo "Descargando DragonMineZ desde el secret DMZ_JAR_URL..."
            curl -sSL -o libs/dragonminez-2_1_3.jar "$DMZ_JAR_URL"
          else
            echo "::error::Falta la jar de DragonMineZ. Commiteala en libs/, o configurá el secret DMZ_JAR_URL con una URL de descarga (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # Cachea ~/.gradle entre corridas para no volver a bajar ForgeGradle,
      # Parchment y el resto de las dependencias en cada build.
      - name: Cachear Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      # continue-on-error: la propia corrida de Gradle nunca "falla" el step
      # acá; usamos steps.gradle_build.outcome más abajo para decidir qué
      # hacer, y recién al final fallamos el job de verdad si corresponde.
      # Así el log siempre llega a guardarse, pase lo que pase.
      - name: Build
        id: gradle_build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Subir la jar compilada
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dmzkiaspects-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Guarda el log completo como un archivo normal del repo, commiteado
      # de vuelta a la rama. Existe porque los logs "de verdad" de Actions
      # se sirven desde un host que algunas herramientas externas no pueden
      # alcanzar — esto los deja como texto plano versionado, legible con
      # un git pull común y silvestre, sin pasar por esa infraestructura.
      - name: Guardar log si el build falló
        if: steps.gradle_build.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          cp build-output.log ci-logs/last-failure.log
          {
            echo "Run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "Commit: ${{ github.sha }}"
            echo "Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "----"
            cat build-output.log
          } > ci-logs/last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-logs/last-failure.log
          git commit -m "CI: guardar log de build fallido [skip ci]" || echo "Nada nuevo para commitear."
          git push

      - name: Subir reportes de test/build si algo falla
        if: steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            **/build/reports/
          if-no-files-found: ignore

      # Recién acá el job realmente falla (en rojo) si correspondía, una vez
      # que ya se guardó todo lo anterior.
      - name: Marcar el job como fallido si el build falló
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1
